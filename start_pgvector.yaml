# Credentials below are applied on FIRST container create only (new volume).
# If you change POSTGRES_* here, existing data keeps old passwords — use `docker compose ... down -v` to reset (data loss).
# Host port 5433 must match POSTGRES_PORT in src/server/.env (Memory MCP loads that file).
version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16  # This image includes PostgreSQL 16 and the pgvector extension
    container_name: mcp_postgres
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=mcp_memory
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists data even if the container is removed

volumes:
  postgres_data: