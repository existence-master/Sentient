version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # Major upgrades are done on purpose in their own pull requests.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: monthly
    groups:
      desktop:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # Major upgrades are done on purpose in their own pull requests.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
