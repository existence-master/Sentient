name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]
  # The merge queue waits for every required check, CLAAssistant included, on each merge group. A pull request
  # can only join the queue after this check passed on it, so on a merge group it just reports success.
  merge_group:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "Signed on the pull request"
        if: github.event_name == 'merge_group'
        run: echo "Every pull request in this merge group passed the CLA check before it could join the queue."
      - name: "CLA Assistant"
        if: > 
          github.event_name == 'pull_request_target' ||
          (github.event.comment && (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          ))
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          path-to-signatures: '.github/signatures/version1/cla.json'
          path-to-document: 'https://github.com/existence-master/Sentient/blob/main/CLA.md'
          # signatures live in this repository on the cla-signatures branch (no personal token to expire)
          branch: 'cla-signatures'
          allowlist: itsskofficial,Kabeer2004,dependabot[bot],github-actions[bot]