# "/assign" and "/unassign" comments on issues. The logic is in .github/scripts/assign.js (tested by
# .github/scripts/assign.test.js). It reads the comment only to compare it with those two words and never runs it.
name: Claim issues

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: claim-${{ github.event.issue.number }}

jobs:
  claim:
    # Issues only (a PR comment also fires issue_comment), and only comments that mention a command.
    if: >-
      github.event.issue.pull_request == null &&
      (contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, '/unassign'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # issue_comment always runs on the default branch, so this is our own script, never a contributor's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('./.github/scripts/assign.js');
            await run({ github, context, core });
