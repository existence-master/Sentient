# Builds installers for Windows, macOS and Linux when a maintainer pushes a version tag (v3.0.0, v3.1.0-beta.1...)
# and attaches them to a draft GitHub release. Builds are not code-signed yet.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Engine environment
        shell: bash
        run: |
          uv venv .venv --python 3.12
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          # voice brings numpy, which the engine imports on start (sentient.voice); the heavy voice runtimes stay
          # out of the frozen engine through the EXCLUDES in packaging/sentient-engine.spec
          uv pip install --python "$PY" -e ".[dev,voice,whatsapp]"
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"  # unsigned until signing certificates are set up
        run: |
          npm ci
          npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: sentient-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # The release notes are this version's section of CHANGELOG.md (built from changes/ by
      # packaging/release_changelog.py), so users read the same plain-language notes everywhere.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          awk -v head="## [$v]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $v"; exit 1; fi
          printf '\n---\nInstallers are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper will warn the first time you open them.\n' >> notes.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: dist/*
